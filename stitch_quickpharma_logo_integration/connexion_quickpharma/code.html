<!DOCTYPE html>

<html class="h-full" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>QuickPharma - Connexion</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#005596',
              'blue-hover': '#004377',
              teal: '#1cb0a8',
              light: '#f8fafc',
              soft: '#eff4ff',
            }
          }
        }
      }
    }
  </script>
<!-- Custom Styles for iOS Touch Interaction & Polish -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8faff;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #ffffff inset;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
<!-- BEGIN: TopBar -->
<!-- Top bar containing language switcher and iOS safe area padding -->
<header class="w-full pt-4 px-6 flex justify-end items-center" data-purpose="header-navigation">
<div class="inline-flex items-center gap-1.5 bg-white/80 backdrop-blur border border-slate-200/80 rounded-full px-3 py-1 shadow-sm text-xs font-medium text-slate-600">
<svg aria-hidden="true" class="w-3.5 h-3.5 text-teal-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<select aria-label="Choisir la langue" class="bg-transparent border-0 py-0 pl-1 pr-5 text-xs text-slate-700 font-semibold focus:ring-0 cursor-pointer">
<option selected="" value="fr">FR</option>
<option value="en">EN</option>
<option value="es">ES</option>
<option value="ar">AR</option>
</select>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="w-full max-w-md mx-auto px-5 py-4 flex-1 flex flex-col justify-center items-center" data-purpose="main-login-area">
<!-- Branding Section with Logo and Subtitles -->
<!-- BEGIN: BrandHeader -->
<div class="w-full flex flex-col items-center text-center mb-7" data-purpose="brand-presentation">
<!-- QuickPharma Official Logo -->
<div class="mb-4 transition-transform active:scale-95 duration-200">
<img alt="Logo Quick Pharma" class="h-16 w-auto object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnYmRDPQ9ptezLObOS0HFWORuQwfAXAm68fQdrNgbVHhOGr7_4UszrhsoYEFp6XqUMm896OzCECGC_OaJONDVKBK7CxfaBjsv3LBNghwZ1vIPlEVDcJiPgbdudO4npbnjAdlgTAciTOGMOhaDmKeCT3lLe59ODr5-35cL-vJpJOCu039hVO2c4napD4nj3lR16he42_1wPAIZdg6G1WqSSqO32cN8bJ32wvOpR-dL2y3Ux8KwsgePv2d-nvjkqrWHS1Q"/>
</div>
<!-- App Name & Service Tagline -->
<h1 class="text-2xl sm:text-[26px] font-extrabold tracking-tight text-slate-900 mb-1">
        Quick stock
      </h1>
<p class="text-sm font-medium text-slate-500">
        Système de gestion de stock
      </p>
</div>
<!-- END: BrandHeader -->
<!-- Card Login Container -->
<!-- BEGIN: LoginFormCard -->
<section aria-labelledby="card-heading" class="w-full bg-white rounded-2xl shadow-[0_4px_24px_rgba(0,85,150,0.06),0_1px_3px_rgba(0,0,0,0.03)] border border-slate-100/80 p-6 sm:p-7">
<!-- Card Header -->
<div class="mb-6">
<h2 class="text-xl font-bold text-slate-900 tracking-tight mb-1.5" id="card-heading">
          Connexion
        </h2>
<p class="text-sm text-slate-500 leading-snug">
          Entrez vos identifiants pour accéder à votre compte
        </p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Field: Email -->
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1.5" for="email">
            Email
          </label>
<div class="relative rounded-lg shadow-sm">
<input autocomplete="email" class="w-full px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 bg-white rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#005596] focus:border-transparent transition duration-150" id="email" name="email" placeholder="Entrez votre email" required="" type="email"/>
</div>
</div>
<!-- Field: Password -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-sm font-semibold text-slate-700" for="password">
              Mot de passe
            </label>
<a class="text-xs font-semibold text-[#1cb0a8] hover:text-teal-700 hover:underline transition-colors" href="#forgot">
              Mot de passe oublié ?
            </a>
</div>
<div class="relative rounded-lg shadow-sm">
<input autocomplete="current-password" class="w-full px-3.5 py-2.5 pr-10 text-sm text-slate-900 placeholder:text-slate-400 bg-white rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#005596] focus:border-transparent transition duration-150" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Password visibility toggle button -->
<button aria-label="Afficher ou masquer le mot de passe" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 transition-colors" id="togglePassword" type="button">
<!-- Eye open icon -->
<svg class="w-4 h-4 hidden" fill="none" id="eyeOpenIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Eye closed/slashed icon -->
<svg class="w-4 h-4" fill="none" id="eyeClosedIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Field: Remember Me Checkbox -->
<div class="flex items-center pt-0.5">
<input class="h-4 w-4 rounded border-slate-300 text-[#005596] focus:ring-[#005596] cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2.5 block text-xs font-medium text-slate-600 cursor-pointer select-none" for="remember-me">
            Se souvenir de moi
          </label>
</div>
<!-- Action: Primary Submit Button -->
<div class="pt-2">
<button class="w-full py-2.5 px-4 bg-[#005596] hover:bg-[#004377] active:bg-[#003660] text-white text-sm font-semibold rounded-lg shadow-sm hover:shadow transition-all duration-150 flex justify-center items-center gap-2 tracking-wide cursor-pointer" type="submit">
<span>Se connecter</span>
</button>
</div>
</form>
<!-- Bottom Action: Sign Up link -->
<div class="mt-6 pt-4 text-center border-t border-slate-100">
<p class="text-xs text-slate-500 font-normal">
          Vous n’avez pas de compte ? 
          <a class="text-[#1cb0a8] hover:text-teal-700 font-bold transition-colors ml-0.5" href="#signup">
            S’inscrire
          </a>
</p>
</div>
</section>
<!-- END: LoginFormCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: SecurityFooter -->
<!-- Healthcare & Data Protection Notice compliant with pharmacy standards -->
<footer class="w-full py-4 px-6 text-center text-slate-400 text-[11px] leading-relaxed" data-purpose="security-notice">
<div class="max-w-md mx-auto flex items-center justify-center gap-1.5 text-slate-400">
<svg class="w-3.5 h-3.5 text-teal-600 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Plateforme sécurisée certifiée HDS • Données de santé protégées</span>
</div>
<div class="mt-1">
      © 2025 QuickPharma. Tous droits réservés.
    </div>
</footer>
<!-- END: SecurityFooter -->
<!-- BEGIN: ScriptHandlers -->
<script data-purpose="password-visibility-toggle">
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeOpenIcon = document.getElementById('eyeOpenIcon');
    const eyeClosedIcon = document.getElementById('eyeClosedIcon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Toggle icon state
        if (isPassword) {
          eyeOpenIcon.classList.remove('hidden');
          eyeClosedIcon.classList.add('hidden');
        } else {
          eyeOpenIcon.classList.add('hidden');
          eyeClosedIcon.classList.remove('hidden');
        }
      });
    }
  </script>
<!-- END: ScriptHandlers -->
</body></html>
